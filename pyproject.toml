[project]
name = "searchmcp"
version = "1.1.0"
description = "Servidor MCP de búsqueda semántica multilingüe con embeddings locales, ChromaDB y DuckDuckGo"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "ddgs>=3.0.0",
    "chromadb>=0.5.5",
    "sentence-transformers>=3.0.0",
    "langdetect>=1.0.9",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
]

[project.scripts]
searchmcp = "searchmcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["searchmcp"]
